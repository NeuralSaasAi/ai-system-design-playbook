name: Something is wrong or unclear
description: A fact is out of date, an explanation is confusing, a formula is off, or a diagram is misleading.
title: "[Fix] "
labels: ["content"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: e.g. case-studies/01-customer-support-agent.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - A fact is wrong or out of date
        - A number or formula doesn't add up
        - The explanation is hard to follow
        - A diagram or code sample is wrong
        - Something important is missing
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you expect, and what did you find? Link a source if you are correcting a fact.
    validations:
      required: true
