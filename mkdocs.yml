# Website config. The site is built from the same markdown you read on GitHub.
# Build locally:  uv run --with-requirements requirements-site.txt mkdocs serve
# The site URL comes from the SITE_URL environment variable (a CI variable).
site_name: AI System Design Playbook
site_description: >-
  Free AI system design playbook: 20 LLM system design case studies covering RAG architecture,
  AI agent architecture, scale, cost, failure modes and a 45-minute AI system design interview plan.
site_author: NeuralSaas AI
site_url: !ENV [SITE_URL, "https://ai-system-design-playbook.neuralsaasai.com/"]
repo_url: https://github.com/NeuralSaasAi/ai-system-design-playbook
repo_name: NeuralSaasAi/ai-system-design-playbook
edit_uri: edit/main/
copyright: An open-education initiative by <a href="https://neuralsaasai.com">NeuralSaas AI</a>. Free forever. Content CC BY-SA 4.0.
# Build from the repository root, so README.md is the home page.
docs_dir: .
site_dir: site
exclude_docs: |
  /.*
  /site/
  /scripts/
  /templates/
  /placeholder/
  /overrides/
  /site_hooks.py
  __pycache__/
  /requirements-site.txt
  /mkdocs.yml
  /kiro-permissions.draft.yaml
  /IMPLEMENTATION_TRACKER.md
  /Makefile
  /lychee.toml
  /LICENSE
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
extra_css:
  - assets/stylesheets/extra.css
plugins:
  - same-dir
  - search
  - gh-admonitions
hooks:
  - site_hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra:
  social_image: assets/social-preview.png
  # Set GOOGLE_SITE_VERIFICATION (a CI variable) to the token from Google Search Console
  google_site_verification: !ENV [GOOGLE_SITE_VERIFICATION, ""]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NeuralSaasAi/ai-system-design-playbook
    - icon: material/web
      link: https://neuralsaasai.com
